  <link rel="stylesheet" href="style.css">

<body>
  <fieldset>
    <legend>General</legend>
    <div>
      <label for="background">Background: </label>
      <input type="file" id="background" name="background" required accept="image/png"/>
    </div>

    </div>

    <div>

      <input type="text" id="top-right-text" name="top-right-text" />
    </div>

    <div>
      <label for="bottom-left-text">Bottom left text: </label>
      <input type="text" id="bottom-left-text" name="bottom-left-text" />
    </div>
  </fieldset>

  <fieldset>
    <legend>Participant 1</legend>

      <input type="text" id="participant1-name" name="participant1-name" />
    </div>
    <div>
      <label for="participant1-thumbnail">Thumbnail: </label>
      <select class="thumbnail-selector" name="participant1-thumbnail" id="participant1-thumbnail">
